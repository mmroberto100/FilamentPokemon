name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, debug and release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches ~/.gradle (wrapper, dependencies, build cache). Only develop writes the cache;
      # pull requests and master read it so they never evict each other's entries.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      # No local.properties in CI: sdk.dir falls back to ANDROID_HOME (preinstalled on the
      # ubuntu image, licences accepted, AGP downloads any missing platform) and the Sketchfab
      # token to the unset SKETCHFAB_API_TOKEN variable, so BuildConfig ships an empty string.
      # Live API tests stay skipped because SKETCHFAB_LIVE is not set.
      - name: Unit tests and APKs
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests
            app/build/test-results
          if-no-files-found: ignore
